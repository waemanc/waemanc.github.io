<!DOCTYPE html>

<html lang="en">

<head>
    <title>Class Schedule</title>
</head>

<body>

    <table border="1">
        <thead>
            <tr>
                <th>Department Code</th>
                <th>Class Number</th>
                <th>Number of Credits</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>CSCE</td>
                <td>102</td>
                <td>3</td>
            </tr>
            <tr>
                <td>SCHC</td>
                <td>428</td>
                <td>3</td>
            </tr>
            <tr>
                <td>BIOL</td>
                <td>541</td>
                <td>3</td>
            </tr>
            <tr>
                <td>SCHC</td>
                <td>499</td>
                <td>3</td>
            </tr>
            <tr>
                <td>HPEB</td>
                <td>335</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>

    <h2>Choose Favorite Class</h2>

    <form action="/example.html" method="POST">
        <div>
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" required>
        </div>
        <br>

        <div>
            <label for="studentEmail">University Email</label>
            <input type="email" id="studentEmail" required>
        </div>
        <br>

        <div>
            <p>Choose your favorite class</p>
            <input type="radio" id="CSCE102" name="FavClass" value="value1">
            <label for="CSCE102">CSCE 102: Intro to Programming</label>
            <br>

            <input type="radio" id="BIOL541" name="FavClass" value="value1">
            <label for="BIOL541">BIOL 541: Biochemistry</label>
            <br>

            <input type="radio" id="SCHC428" name="FavClass" value="value1">
            <label for="SCHC428">SCHC428: Film and Media for Tourism and Travel</label>
            <br>

            <input type="radio" id="HPEB 335" name="FavClass" value="value1">
            <label for="HPEB 335">HPEB 335: First Aid and Emergency Preparedness</label>
            <br>

            <input type="radio" id="SCHC 499" name="FavClass" value="value1">
            <label for="SCHC 499">SCHC 499: Honors Thesis</label>
            <br>
        </div>

        <button type="submit">Submit Response</button>
    </form>
</body>

</html>
