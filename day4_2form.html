<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Form Example Day 4</title>
    </head>
    <body>
        <h2>Project Submission Form</h2>

        <form action="/example.html" method="POST">

            <div>
                <label for="studentName">Full Name:</label>
                <input type="text" id="studentName" required>
                <!--provides a textbox where someone can type in it-->
            </div>
            <br> 
            <!--br is self closing and marks the end of a paragraph-->

            <div>
                <label for="studentEmail">University Email:</label>
                <input type="email" id="studentEmail" required>
                <!--required means that it is required to put something in for submission-->
            </div>
            <br>
            <!--when you finish a feature it is best to commit and push to partially keep track of what you are doing-->

            <div>
                <p>Primary Focus:</p>
                <input type="radio" id="focus1" name="projectFocus" value="value1" checked>
                <!--radio is circle buttons that you can only select once, id is what I am attaching it to; name has to match in order for the buttons to be attached together; value is the data that will be sent to the form when we hit submit-->
                <label for="focus1">Focus 1</label>
                <br>

                <input type="radio" id="focus2" name="projectFocus" value="value2">
                <label for="focus2">Focus 2</label>
                <br>
            </div>

            <button type="submit">Submit Project</button>

        </form>
    </body>
</html>
